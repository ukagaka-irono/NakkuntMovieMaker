name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  build:
    name: ビルドとテスト (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: ネイティブライブラリの取得とビルド（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/fetch-native.ps1
          ./tools/build-native.ps1

      # macOS の FFmpeg はソースからビルドするので（数分かかる）、ソースの版とビルドの手順が同じあいだは前の結果を使う
      - name: macOS の FFmpeg のビルドのキャッシュ
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: native/build/osx-arm64-ffmpeg
          key: ffmpeg-osx-arm64-${{ hashFiles('tools/native-deps.json', 'tools/build-native.sh') }}

      - name: ネイティブライブラリの取得とビルド（Linux・macOS）
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ] && ! command -v pkg-config >/dev/null; then brew install pkgconf; fi
          ./tools/fetch-native.sh
          ./tools/build-native.sh

      - name: 復元
        run: dotnet restore NakkuntMovieMaker.slnx

      - name: ビルド
        run: dotnet build NakkuntMovieMaker.slnx -c Release --no-restore

      - name: テスト
        run: dotnet test --solution NakkuntMovieMaker.slnx -c Release --no-build
        env:
          NMM_REQUIRE_FFMPEG: '1'
          NMM_REQUIRE_NMM_AUDIO: '1'
          NMM_REQUIRE_FONTS: '1'
          NMM_REQUIRE_COLORFULTALK: '1'

      # ゴールデン画像と違ったときに、描いた結果を確かめられるように残す
      - name: ゴールデン画像のテストで描いた結果
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-actual-${{ matrix.os }}
          path: tests/*/bin/Release/net10.0/golden-actual/
          if-no-files-found: ignore
