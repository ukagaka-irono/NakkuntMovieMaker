name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  build:
    name: ビルドとテスト (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # 取得したアーカイブ（Slang・MoltenVK・Vulkan-Headers・OpenColorIO・FFmpeg などのソース）を使い回す。
      # 取得し直す時間を省くのと、取得先が一時的に切れたとき（ffmpeg.org で接続が切られ、1 分ほど待ったことがある）に止まらないようにするため。
      # 使うたびに fetch-native が SHA-256 を確かめるので、版が変わったものだけ取得し直す。展開したソース（src-*）は入れない
      - name: 取得したアーカイブのキャッシュ
        uses: actions/cache@v5
        with:
          path: |
            native/downloads
            !native/downloads/src-*
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/native-deps.json') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-

      # FFmpeg はソースからビルドするので（数分かかる）、ソースの版とビルドの手順が同じあいだは前の結果を使う
      - name: FFmpeg のビルドのキャッシュ
        uses: actions/cache@v5
        with:
          path: native/build/*-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/native-deps.json', 'tools/build-ffmpeg.sh') }}
          # native-deps.json のほかの部分だけが変わったときも、前のビルドを使えるようにする（版が違えば build-ffmpeg.sh がビルドし直す）
          restore-keys: ffmpeg-${{ runner.os }}-${{ runner.arch }}-

      # OpenColorIO と依存するライブラリも同じ（版とビルドの手順は tools/build-native の .stamp で確かめる）
      - name: OpenColorIO のビルドのキャッシュ
        uses: actions/cache@v5
        with:
          path: native/build/*-ocio
          key: ocio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/native-deps.json', 'native/nmm_ocio/deps/CMakeLists.txt') }}
          restore-keys: ocio-${{ runner.os }}-${{ runner.arch }}-

      # Windows の FFmpeg は、ランナーに入っている MSYS2 の UCRT64 の gcc でビルドする
      - name: FFmpeg のビルドに使うものを入れる（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm make diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-jq'

      # GPU のテストは、CPU で動く Vulkan（Mesa の lavapipe）と検証レイヤーで回す（CI には GPU がないため）
      - name: FFmpeg のビルドと GPU のテストに使うものを入れる（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm zlib1g-dev mesa-vulkan-drivers libvulkan1 vulkan-validationlayers

      - name: ネイティブライブラリの取得とビルド（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/fetch-native.ps1
          ./tools/build-native.ps1

      - name: ネイティブライブラリの取得とビルド（Linux・macOS）
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ] && ! command -v pkg-config >/dev/null; then brew install pkgconf; fi
          ./tools/fetch-native.sh
          ./tools/build-native.sh

      - name: 復元
        run: dotnet restore NakkuntMovieMaker.slnx

      - name: ビルド
        run: dotnet build NakkuntMovieMaker.slnx -c Release --no-restore

      # macOS の GPU（MoltenVK）で、描画が自己テストに通るか（通らなければ、どのシェーダーで何が起きたか）を出す。
      # MoltenVK のエラーと警告（シェーダーを Metal に変換・コンパイルしたときの失敗の理由）も出す
      - name: GPU の診断（macOS）
        if: runner.os == 'macOS'
        continue-on-error: true
        run: dotnet src/NakkuntMovieMaker.Cli/bin/Release/net10.0/nmm.dll probe --gpu
        env:
          NMM_VULKAN_ALLOW_SOFTWARE: '1'
          MVK_CONFIG_LOG_LEVEL: '2'

      # GPU のテストだけを先に、1 件ずつ結果を出しながら回す（lavapipe が落ちたときに、どのテストかわかるように）
      - name: GPU のテスト（Linux）
        if: runner.os == 'Linux'
        run: dotnet test --project tests/NakkuntMovieMaker.Rendering.Vulkan.Tests -c Release --no-build --output Detailed --no-progress
        env:
          NMM_REQUIRE_VULKAN: '1'

      - name: テスト
        run: dotnet test --solution NakkuntMovieMaker.slnx -c Release --no-build
        env:
          NMM_REQUIRE_FFMPEG: '1'
          NMM_REQUIRE_NMM_AUDIO: '1'
          NMM_REQUIRE_FONTS: '1'
          NMM_REQUIRE_COLORFULTALK: '1'
          NMM_REQUIRE_OCIO: '1'
          # Linux では GPU（lavapipe）のテストを必ず回す。Windows・macOS の CI では、使える GPU がなければスキップする
          NMM_REQUIRE_VULKAN: ${{ runner.os == 'Linux' && '1' || '0' }}

      # ゴールデン画像と違ったときに、描いた結果を確かめられるように残す
      - name: ゴールデン画像のテストで描いた結果
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-actual-${{ matrix.os }}
          path: tests/*/bin/Release/net10.0/golden-actual/
          if-no-files-found: ignore
