name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ビルドとテスト (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: ネイティブライブラリの取得とビルド（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/fetch-native.ps1
          ./tools/build-native.ps1

      - name: ネイティブライブラリの取得とビルド（Linux・macOS）
        if: runner.os != 'Windows'
        run: |
          ./tools/fetch-native.sh
          ./tools/build-native.sh

      - name: 復元
        run: dotnet restore NakkuntMovieMaker.slnx

      - name: ビルド
        run: dotnet build NakkuntMovieMaker.slnx -c Release --no-restore

      - name: テスト
        run: dotnet test --solution NakkuntMovieMaker.slnx -c Release --no-build
        env:
          # macOS 用の LGPL 版 FFmpeg はまだ用意していないので、macOS だけは必須にしない
          NMM_REQUIRE_FFMPEG: ${{ runner.os != 'macOS' && '1' || '0' }}
          NMM_REQUIRE_NMM_AUDIO: '1'
          NMM_REQUIRE_FONTS: '1'
